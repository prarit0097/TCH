# Add as a NEW virtual host. Do not replace existing virtual hosts.
# Set DNS first. Issue a certificate for both hostnames, then enable this config.
server {
    listen 80;
    server_name thecircadianhospital.com www.thecircadianhospital.com;
    location /.well-known/acme-challenge/ { root /var/www/circadian-acme; }
    location / { return 301 https://thecircadianhospital.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.thecircadianhospital.com;
    ssl_certificate /etc/letsencrypt/live/thecircadianhospital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecircadianhospital.com/privkey.pem;
    return 301 https://thecircadianhospital.com$request_uri;
}
server {
    listen 443 ssl;
    server_name thecircadianhospital.com;
    ssl_certificate /etc/letsencrypt/live/thecircadianhospital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecircadianhospital.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
