# Internal app listener; terminate HTTPS in the existing host proxy.
# Never publish this listener directly to the public network.
server {
    listen 80;
    server_name thecircadianhospital.com www.thecircadianhospital.com;
    root /srv/circadian;
    index index.html;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /images/ { expires 7d; }
    location /django-static/ { alias /srv/django-static/; expires 7d; }
    location ~ ^/(api|staff)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Only the host's loopback-bound TLS proxy can reach this listener.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
