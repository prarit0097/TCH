# Dedicated aliases; the existing application and primary virtual host are unchanged.
server {
    listen 80;
    server_name drbrccircadianhospital.com www.drbrccircadianhospital.com circadianhospital.com www.circadianhospital.com;
    location /.well-known/acme-challenge/ { root /var/www/circadian-acme; }
    location / { return 301 https://thecircadianhospital.com$request_uri; }
}
# HTTPS: install this block only after issuing the alias certificate.
server {
    listen 443 ssl http2;
    server_name drbrccircadianhospital.com www.drbrccircadianhospital.com circadianhospital.com www.circadianhospital.com;
    ssl_certificate /etc/letsencrypt/live/circadian-hospital-aliases/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circadian-hospital-aliases/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://thecircadianhospital.com$request_uri;
}
